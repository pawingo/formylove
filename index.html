<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>для любимой амины <3 </title>
    <!-- подключаем CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- виньетка -->
    <div class="vignette"></div>
    
    <!-- ЧАСТИЦЫ (ГЕНЕРИРУЮТСЯ В JS) -->
    <div class="particle-cloud" id="particles"></div>
    <div class="sparkle" id="sparkles"></div>
    
    <!-- легкий фон -->
    <div class="feb-tag">14 ✦ февраля</div>

    <!-- ===== ОСНОВНОЙ ЭКРАН ===== -->
    <div class="canvas">
        <div class="valentine-scene">
            <!-- кольца свечения -->
            <div class="glow-rings third"></div>
            <div class="glow-rings second"></div>
            <div class="glow-rings"></div>
            
            <!-- СЕРДЦЕ — SVG, НО БЕЗ АНИМАЦИИ PATH (ТОЛЬКО CSS-ТРАНСФОРМАЦИИ) -->
            <div class="heart-core">
                <svg class="heart-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                            <feMerge>
                                <feMergeNode in="offsetblur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff7b8c" />
                            <stop offset="50%" stop-color="#ff4d6d" />
                            <stop offset="100%" stop-color="#b3003b" />
                        </linearGradient>
                        <radialGradient id="sparkGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffe6f0" />
                            <stop offset="80%" stop-color="#ff99aa" />
                        </radialGradient>
                    </defs>
                    <!-- ОСНОВНАЯ ФОРМА СЕРДЦА — БЕЗ АНИМАЦИИ PATH, ТОЛЬКО СТАТИЧНАЯ -->
                    <path d="M50 25.5 C 35 5, 0 15, 0 40 C 0 65, 50 90, 50 90 C 50 90, 100 65, 100 40 C 100 15, 65 5, 50 25.5 Z" 
                        fill="url(#heartGrad)" filter="url(#glow)" opacity="0.98"/>
                    <!-- внутренний блик -->
                    <path d="M50 32 C 40 18, 15 26, 15 44 C 15 63, 50 82, 50 82 C 50 82, 85 63, 85 44 C 85 26, 60 18, 50 32 Z" 
                        fill="url(#sparkGrad)" opacity="0.2" filter="url(#glow)"/>
                    <!-- маленькие блики (статические) -->
                    <circle cx="38" cy="45" r="2.5" fill="#fff5f7" opacity="0.8"/>
                    <circle cx="62" cy="45" r="2.5" fill="#fff5f7" opacity="0.8"/>
                    <circle cx="50" cy="65" r="2" fill="#ffd9e2" opacity="0.7"/>
                </svg>
            </div>
            
            <!-- КНОПКА -->
            <div class="signature" id="revealButton">
                ✦ для тебя ✦
            </div>
        </div>
    </div>

    <!-- ===== СЮРПРИЗ КОНТЕНТ ===== -->
    <div class="surprise-content" id="surprise">
        <div class="wish-card">
            <div class="close-btn" id="closeBtn">✕</div>
            <h1 class="wish-title">♡ 14.02 ♡</h1>
            <div class="wish-message">
                Ты — самое тёплое и лучшее, что есть в моей жизни.
            </div>
            <ul class="wish-list">
                <li>Твоя искренняя улыбка восхитительна!</li>
                <li>Каждый момент с тобой - счастье</li>
                <li>Ты самая любимая девочка на свете!</li>
                <li>Хочу быть с тобой вечно</li>
            </ul>
            <div class="stars">
                ✦ ✦ ✦
            </div>
            <p class="wish-footer">
                С 14 февраля, любимая
            </p>
        </div>
    </div>

    <!-- подключаем JavaScript -->
    <script src="script.js"></script>
</body>
</html>
