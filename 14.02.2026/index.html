<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Твоей ✦ единственной</title>
    <!-- подключаем CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== ВИНЬЕТКА + ФОН ===== -->
    <div class="vignette"></div>
    <div class="particle-cloud" id="particles"></div>
    <div class="sparkle" id="sparkles"></div>
    <div class="delicate-lines"></div>
    <div class="ambient"></div>

    <!-- ===== НАЧАЛЬНЫЙ ЭКРАН (ВИЗУАЛ) ===== -->
    <div class="canvas">
        <div class="valentine-scene" id="mainScene">
            <!-- слои сияния -->
            <div class="glow-rings third"></div>
            <div class="glow-rings second"></div>
            <div class="glow-rings"></div>
            
            <!-- СЕРДЦЕ (анимированное) -->
            <div class="heart-core">
                <svg class="heart-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
                            <feMerge>
                                <feMergeNode in="offsetblur" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff7b8c" />
                            <stop offset="50%" stop-color="#ff4d6d" />
                            <stop offset="100%" stop-color="#b3003b" />
                        </linearGradient>
                        <radialGradient id="sparkGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffe6f0" />
                            <stop offset="80%" stop-color="#ff99aa" />
                        </radialGradient>
                    </defs>
                    <path d="M50 25.5 C 35 5, 0 15, 0 40 C 0 65, 50 90, 50 90 C 50 90, 100 65, 100 40 C 100 15, 65 5, 50 25.5 Z" 
                        fill="url(#heartGrad)" filter="url(#glow)" opacity="0.98">
                        <animate attributeName="d" dur="4s" values="M50 25.5 C 35 5, 0 15, 0 40 C 0 65, 50 90, 50 90 C 50 90, 100 65, 100 40 C 100 15, 65 5, 50 25.5 Z;
                                                                   M50 23 C 32 3, 0 13, 0 38 C 0 63, 50 93, 50 93 C 50 93, 100 63, 100 38 C 100 13, 68 3, 50 23 Z;
                                                                   M50 25.5 C 35 5, 0 15, 0 40 C 0 65, 50 90, 50 90 C 50 90, 100 65, 100 40 C 100 15, 65 5, 50 25.5 Z" 
                                    repeatCount="indefinite" fill="freeze" />
                    </path>
                    <path d="M50 32 C 40 18, 15 26, 15 44 C 15 63, 50 82, 50 82 C 50 82, 85 63, 85 44 C 85 26, 60 18, 50 32 Z" 
                        fill="url(#sparkGrad)" opacity="0.2" filter="url(#glow)"></path>
                    <circle cx="38" cy="45" r="2.5" fill="#fff5f7" opacity="0.8">
                        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="62" cy="45" r="2.5" fill="#fff5f7" opacity="0.8">
                        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="65" r="2" fill="#ffd9e2" opacity="0.7">
                        <animate attributeName="r" values="1.5;2.5;1.5" dur="2s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
            
            <!-- ЭТО КНОПКА — «ДЛЯ ТЕБЯ» ПОКАЗЫВАЕТ ОСНОВНОЙ КОНТЕНТ -->
            <div class="signature" id="revealButton">
                ✦ для тебя ✦
            </div>
        </div>
    </div>

    <!-- ===== СКРЫТАЯ ЧАСТЬ — ПОЖЕЛАНИЯ И ТЁПЛЫЕ СЛОВА ===== -->
    <div class="surprise-content" id="surprise">
        <div class="wish-card">
            <div class="close-btn" id="closeBtn">✕</div>
            <h1 class="wish-title">♡ 14 февраля ♡</h1>
            <div class="wish-message">
                Ты — самое красивое, что есть в моём мире.<br>Спасибо, что ты есть.
            </div>
            <ul class="wish-list">
                <li>твоя улыбка — мой любимый свет</li>
                <li>каждый день с тобой — подарок</li>
                <li>обещаю делать тебя счастливой</li>
                <li>сегодня, завтра и всегда</li>
            </ul>
            <div style="font-size: 1.7rem; margin-top: 1.2rem; letter-spacing: 12px; color: #ffb6c1; text-shadow: 0 0 30px #ff4d6d;">
                ✦ ✦ ✦
            </div>
            <p style="margin-top: 1.8rem; font-size: 1.1rem; font-weight: 200; opacity: 0.9; border-top: 1px solid rgba(255,200,200,0.2); padding-top: 1.2rem;">
                Только для тебя. С 14 февраля, любовь моя.
            </p>
        </div>
    </div>

    <!-- дата в углу (тонко) -->
    <div class="feb-tag">
        14 ❀ февраля
    </div>

    <!-- подключаем JavaScript -->
    <script src="script.js"></script>
</body>
</html>
